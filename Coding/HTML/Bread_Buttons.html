<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bread Buttons</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #fff8e1;
    font-family: sans-serif;
  }
  button {
    background: #ffcc80;
    border: 2px solid #ffb74d;
    padding: 15px 30px;
    margin: 10px;
    font-size: 1.2rem;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 10px 10px 20px rgba(0,0,0,0.25);
    transition: box-shadow 1s ease, transform 1s ease;
  }
  button:hover {
    box-shadow: 25px 25px 40px rgba(0,0,0,0.45);
    animation: wiggle 0.4s ease-in-out;
  }
  button:active {
    transform: scale(0.9);
  }

  @keyframes wiggle {
    0% { transform: translateY(-3px) rotate(0deg); }
    25% { transform: translateY(-3px) rotate(3deg); }
    50% { transform: translateY(-3px) rotate(-3deg); }
    75% { transform: translateY(-3px) rotate(2deg); }
    100% { transform: translateY(-3px) rotate(0deg); }
  }

  #message {
    margin-top: 30px;
    font-size: 2rem;
    font-weight: bold;
    color: #d32f2f;
    display: inline-block;
    transform: scale(0);
    transform-origin: bottom center; /* pivot from bottom */
  }

  @keyframes jello {
    0%   { transform: scale3d(1,1,1); }
    15%  { transform: scale3d(1.25,0.75,1); }
    25%  { transform: scale3d(0.75,1.25,1); }
    35%  { transform: scale3d(1.15,0.85,1); }
    45%  { transform: scale3d(0.95,1.05,1); }
    55%  { transform: scale3d(1.05,0.95,1); }
    65%  { transform: scale3d(1.02,0.98,1); }
    75%  { transform: scale3d(0.98,1.02,1); }
    100% { transform: scale3d(1,1,1); }
  }

  .show-jello {
    animation: jello 1s both;
    transform: scale(1);
  }
</style>
</head>
<body>
  <button id="mainBtn" onclick="spawnBread()">Summon Bread</button>
  <div id="container"></div>
  <div id="message"></div>

<script>
  const breads = ["🥖 Baguette", "🍞 Loaf", "🥯 Bagel", "🥐 Croissant", "🫓 Flatbread"];
  let index = 0;

  function spawnBread() {
    if(index < breads.length){
      const btn = document.createElement("button");
      btn.textContent = breads[index];
      document.getElementById("container").appendChild(btn);
      index++;

      if(index === breads.length){
        const msg = document.getElementById("message");
        msg.textContent = "🎉 Congratulations, you have visited FRANCE!!! 🇫🇷";
        msg.classList.add("show-jello"); // bottom-pivot jello
      }
    }
  }
</script>
</body>
</html>
