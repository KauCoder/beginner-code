<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beginner Showoff</title>
</head>
<body>
    <h1>Buttons!!!</h1>
    <hr>
    <h2>Press These Satisfying Buttons!</h2>

    <button>Press Me!</button>
    <button>Press Me!</button>
    <button>Press Me!</button>
    <button>Press Me!</button>
    <button>Press Me!</button>

    <style>
        body {
            background-color: black;
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
            font-size: 20px;
            color: white;
        }

        button {
            padding: 10px 10px;
            background: red;
            color: white;
            border-color: white;
            border-radius: 5px;
            box-shadow: 5px 5px 15px white;
            font-size: 20px;
            margin: 5px;

            /* smooth grow */
            transition: transform 0.4s ease;
        }

        button:hover {
            transition: 1s ease;
            transform: scale(1.1); /* smooth grow */
            cursor: pointer;
            box-shadow: 10px 10px 20px red;

            background: linear-gradient(90deg,
                red, orange, yellow, green, cyan, blue, violet, red
            );
            background-size: 400%;
            animation:
                rainbow 10s linear infinite
        }

        button:active {
            transition: 1s ease;
            transform: scale(0.9);
            box-shadow: 5px 5px 20px red;
        }

        @keyframes rainbow {
            0% { background-position: 0%; }
            100% { background-position: 400%; }
        }
    </style>
</body>
</html>
