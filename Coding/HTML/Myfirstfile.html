<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First HTML Webpage</title>
</head>
<body>
    <h1>My First Html Webpage</h1>
    <hr>
    <p>This is my first HTML page, I hope you like it!</p>
    <button id="myButton">Satisfying Button</button>
    <style>
        body {
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
            font-size: 20px;
            color: white;
            background-color: black;
        }

        #myButton {
            background-color: white;
            border: 2px solid black;
            padding: 10px 10px;
            text-size-adjust: 20px;
            border-radius: 10px;
            box-shadow: 5px 5px 15px black;
        }

        #myButton:hover {
            box-shadow: 15px 15px 15px red;
            transition: 1s ease;
            cursor: pointer;
            transform: scale(1.1);
            background-color: red;
            border-color: whitesmoke;
            color: white;
        }

        #myButton:active {
            transform: scale(0.9);
            box-shadow: 5px 5px 15px red;
        }

    </style>
</body>
</html>
